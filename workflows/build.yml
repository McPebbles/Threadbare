# Move this to .github/workflows/build.yml — see workflows/README.md for why it
# is not already there.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static checks
        run: |
          python3 tools/verify_kotlin.py
          python3 tools/verify_resources.py
          python3 tools/verify_frame.py
          python3 tools/rules_suite.py

      - name: Injected JavaScript
        run: |
          python3 tools/extract_js.py
          for f in build/js/*.js; do node --check "$f"; done

      - name: Browser behaviour suite
        run: |
          pip install playwright
          python3 -m playwright install --with-deps chromium
          python3 tools/js_suite.py --shots build/shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skin-screenshots
          path: build/shots

  build:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The first real compile. Nothing in this repo has been through a Kotlin
      # compiler as of the initial commit.
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: threadbare-debug
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
